<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="La Cuchilla">
  <title>La Cuchilla</title>
  <!-- PLACEHOLDER de marca: reemplazar por el logo oficial de La Cuchilla
       manteniendo el nombre de archivo (public/logo.svg). Ver README.md. -->
